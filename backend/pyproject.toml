[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "TRY", "DTZ"]
ignore = [
    "B008",   # Depends() in function defaults is the standard FastAPI pattern
    "BLE001", # Broad exception catches in cache helpers are intentional (resilience)
    "S110",   # try-except-pass in cache helpers is intentional (best-effort caching)
    "TRY003", # Long messages in raise are fine for this project size
    "TRY300", # return-in-try is fine for this codebase's structure
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is expected in test files
    "S105",   # hardcoded secrets in tests are test fixtures, not real secrets
]
