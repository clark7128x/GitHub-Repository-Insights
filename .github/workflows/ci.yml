name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Lint backend (ruff)
      run: |
        pip install ruff
        ruff check backend/app/ backend/tests/

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Lint frontend (oxlint)
      run: |
        cd frontend
        npm ci
        npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: insights
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/insights
        CELERY_ENABLED: "false"
        CORS_ORIGINS: "*"
        PYTHONPATH: .
      run: |
        cd backend
        pytest -v
